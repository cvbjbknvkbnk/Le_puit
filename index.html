<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Puits - Aviator 3D</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="ui-container">
        <!-- Barre supérieure : Solde -->
        <div id="top-bar">
            <div id="solde-box">SOLDE : <span id="solde">413711</span> 🪙</div>
        </div>

        <!-- Informations de jeu -->
        <div id="game-info">
            <div id="multiplicateur">1.00x</div>
            <div id="rempart-box">REMPART : <span id="niveau">0</span></div>
        </div>

        <!-- Commandes de mise & lancement -->
        <div id="bottom-bar">
            <div id="mise-box">
                <label for="mise">MISE :</label>
                <input type="number" id="mise" value="38551" min="100">
            </div>
            
            <button id="btn-play" class="btn btn-green">🚀 LANCER (PLAY)</button>
            <button id="btn-take" class="btn btn-yellow hidden">💰 CASH OUT</button>
        </div>
    </div>

    <!-- Fenêtre Overlay (Résultats) -->
    <div id="overlay" class="hidden">
        <div id="overlay-content">
            <h1 id="overlay-title">BOOM !</h1>
            <p id="overlay-desc">Écrasé au rempart 0</p>
            <button id="btn-restart" class="btn btn-blue">REJOUER</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Moteur 3D Three.js et script principal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
</body>
</html>
