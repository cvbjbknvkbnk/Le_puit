<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Puits</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Style CSS intégré pour éviter les problèmes de cache -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      color: #ffffff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
    }
    .hud, .controls {
      pointer-events: auto;
    }
    .hud {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    #multiplier {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00fff0;
      margin: 10px 0;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
    }
    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      text-align: center;
    }
    button {
      flex: 1;
      cursor: pointer;
    }
    #btn-play { background: #00e676; color: #000; }
    #btn-cashout { background: #ffea00; color: #000; }
    button:disabled { opacity: 0.5; }
    .hidden { display: none !important; }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 85, 0.95);
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      pointer-events: auto;
    }
    #btn-replay {
      margin-top: 15px;
      background: #ffffff;
      color: #000;
    }
  </style>

  <!-- Moteur 3D Three.js -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="hud">
      <div id="solde-display">SOLDE : <span id="solde">413711</span> 🌕</div>
      <div id="multiplier">1.00x</div>
      <div id="rempart-display">REMPART : <span id="rempart">0</span></div>
    </div>

    <div class="controls">
      <input type="number" id="mise-input" value="1000" placeholder="Mise">
      <button id="btn-play">🚀 LANCER</button>
      <button id="btn-cashout" disabled>💰 CASH OUT</button>
    </div>

    <div id="game-over-modal" class="hidden">
      <h1 id="result-title">BOOM !</h1>
      <p id="result-desc">Écrasé au rempart 0</p>
      <button id="btn-replay">REJOUER</button>
    </div>
  </div>

  <script src="script.js?v=2" defer></script>
</body>
</html>
