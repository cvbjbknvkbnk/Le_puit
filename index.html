<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Puits</title>
  
  <!-- Configuration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Style CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Moteur 3D Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Zone de rendu du canvas 3D -->
  <div id="canvas-container"></div>

  <!-- Interface utilisateur par-dessus le jeu -->
  <div id="ui-container">
    <div class="hud">
      <div id="solde-display">SOLDE : <span id="solde">413711</span> 🌕</div>
      <div id="multiplier">1.00x</div>
      <div id="rempart-display">REMPART : <span id="rempart">0</span></div>
    </div>

    <div class="controls">
      <input type="number" id="mise-input" value="1000" placeholder="Mise">
      <button id="btn-play">🚀 LANCER</button>
      <button id="btn-cashout" disabled>💰 CASH OUT</button>
    </div>

    <div id="game-over-modal" class="hidden">
      <h1 id="result-title">BOOM !</h1>
      <p id="result-desc">Écrasé au rempart 0</p>
      <button id="btn-replay">REJOUER</button>
    </div>
  </div>

  <!-- Script principal -->
  <script src="script.js" defer></script>
  
  <!-- Enregistrement du Service Worker pour PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
