<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Puits</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Style CSS intégré -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d1a;
      color: #ffffff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      pointer-events: none;
    }
    .hud, .controls {
      pointer-events: auto;
    }
    .hud {
      background: rgba(15, 15, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #multiplier {
      font-size: 3rem;
      font-weight: 900;
      color: #00fff0;
      margin: 5px 0;
      text-shadow: 0 0 15px rgba(0, 255, 240, 0.5);
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    input, button {
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
    }
    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      text-align: center;
      font-size: 1.1rem;
    }
    button {
      flex: 1;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s active;
    }
    button:active {
      transform: scale(0.96);
    }
    #btn-play { background: #00e676; color: #000; }
    #btn-cashout { background: #ffea00; color: #000; }
    button:disabled { opacity: 0.4; }
    .hidden { display: none !important; }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 23, 68, 0.95);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(255, 23, 68, 0.4);
      width: 80%;
      max-width: 320px;
    }
    #btn-replay {
      margin-top: 15px;
      background: #ffffff;
      color: #000;
      width: 100%;
    }
  </style>

  <!-- Libs Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="hud">
      <div id="solde-display">SOLDE : <span id="solde">413711</span> 🌕</div>
      <div id="multiplier">1.00x</div>
      <div id="rempart-display">REMPART : <span id="rempart">0</span></div>
    </div>

    <div class="controls">
      <input type="number" id="mise-input" value="1000" placeholder="Mise">
      <button id="btn-play">🚀 LANCER</button>
      <button id="btn-cashout" disabled>💰 CASH OUT</button>
    </div>

    <div id="game-over-modal" class="hidden">
      <h1 id="result-title">BOOM !</h1>
      <p id="result-desc">Écrasé dans le puits</p>
      <button id="btn-replay">REJOUER</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, bucketGroup;
    let isPlaying = false;
    let currentMultiplier = 1.00;
    let currentRempart = 0;
    let interval;
    let solde = 413711;

    function init3D() {
      const container = document.getElementById('canvas-container');
      if (!container) return;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0d1a);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      // Lumières
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x00fff0, 1.5, 100);
      pointLight.position.set(2, 3, 4);
      scene.add(pointLight);

      // Construction du Seau 3D
      bucketGroup = new THREE.Group();

      // Corps du seau
      const bucketGeo = new THREE.CylinderGeometry(0.8, 0.6, 1.4, 32, 1, true);
      const bucketMat = new THREE.MeshPhongMaterial({ 
        color: 0x00fff0, 
        wireframe: true,
        side: THREE.DoubleSide 
      });
      const bucketMesh = new THREE.Mesh(bucketGeo, bucketMat);
      bucketGroup.add(bucketMesh);

      // Fond du seau
      const bottomGeo = new THREE.CircleGeometry(0.6, 32);
      const bottomMesh = new THREE.Mesh(bottomGeo, bucketMat);
      bottomMesh.rotation.x = Math.PI / 2;
      bottomMesh.position.y = -0.7;
      bucketGroup.add(bottomMesh);

      // Anse du seau
      const handleGeo = new THREE.TorusGeometry(0.8, 0.04, 16, 32, Math.PI);
      const handleMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
      const handleMesh = new THREE.Mesh(handleGeo, handleMat);
      handleMesh.position.y = 0.7;
      bucketGroup.add(handleMesh);

      scene.add(bucketGroup);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (bucketGroup) {
        bucketGroup.rotation.y += 0.015;
        if (isPlaying) {
          bucketGroup.position.y = Math.sin(Date.now() * 0.005) * 0.2 + (currentMultiplier - 1) * 0.5;
        } else {
          bucketGroup.position.y = 0;
        }
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    window.onload = () => {
      init3D();

      const btnPlay = document.getElementById('btn-play');
      const btnCashout = document.getElementById('btn-cashout');
      const btnReplay = document.getElementById('btn-replay');
      const modal = document.getElementById('game-over-modal');

      btnPlay.addEventListener('click', () => {
        isPlaying = true;
        btnPlay.disabled = true;
        btnCashout.disabled = false;
        modal.classList.add('hidden');
        
        interval = setInterval(() => {
          currentMultiplier += 0.05;
          currentRempart += 1;
          document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
          document.getElementById('rempart').innerText = currentRempart;

          // Risque de crash
          if (Math.random() < 0.04) {
            clearInterval(interval);
            isPlaying = false;
            btnPlay.disabled = false;
            btnCashout.disabled = true;
            modal.classList.remove('hidden');
          }
        }, 150);
      });

      btnCashout.addEventListener('click', () => {
        if (!isPlaying) return;
        clearInterval(interval);
        isPlaying = false;
        const mise = parseInt(document.getElementById('mise-input').value) || 1000;
        solde += Math.floor(mise * currentMultiplier);
        document.getElementById('solde').innerText = solde;
        btnPlay.disabled = false;
        btnCashout.disabled = true;
      });

      btnReplay.addEventListener('click', () => {
        currentMultiplier = 1.00;
        currentRempart = 0;
        document.getElementById('multiplier').innerText = '1.00x';
        document.getElementById('rempart').innerText = '0';
        modal.classList.add('hidden');
      });
    };
  </script>
</body>
</html>
