<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Puits 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050a;
      color: #ffffff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      pointer-events: none;
    }
    .hud, .controls, #game-over-modal {
      pointer-events: auto;
    }
    .hud {
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 240, 0.2);
      padding: 16px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }
    .solde-badge {
      font-size: 0.9rem;
      color: #aaa;
      letter-spacing: 1px;
    }
    #solde {
      color: #ffea00;
      font-weight: bold;
    }
    #multiplier {
      font-size: 3.5rem;
      font-weight: 900;
      color: #00fff0;
      margin: 4px 0;
      text-shadow: 0 0 20px rgba(0, 255, 240, 0.6);
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    input, button {
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      outline: none;
    }
    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      text-align: center;
      font-size: 1.2rem;
    }
    button {
      flex: 1.2;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active {
      transform: scale(0.95);
    }
    #btn-play { background: #00e676; color: #051a0e; box-shadow: 0 0 15px rgba(0, 230, 118, 0.4); }
    #btn-cashout { background: #ffea00; color: #1a1500; box-shadow: 0 0 15px rgba(255, 234, 0, 0.4); }
    button:disabled { opacity: 0.3; filter: grayscale(1); box-shadow: none; }
    .hidden { display: none !important; }
    #game-over-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 5, 10, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 23, 68, 0.4);
      padding: 32px 24px;
      border-radius: 24px;
      text-align: center;
      width: 85%;
      max-width: 340px;
      box-shadow: 0 10px 50px rgba(255, 23, 68, 0.5);
    }
    #game-over-modal h1 {
      color: #ff2a5f;
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    #btn-replay {
      margin-top: 20px;
      background: #ffffff;
      color: #000;
      width: 100%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="hud">
      <div class="solde-badge">SOLDE : <span id="solde">413711</span> 🌕</div>
      <div id="multiplier">1.00x</div>
      <div style="font-size: 0.85rem; color: #888;">PROFONDEUR : <span id="rempart" style="color:#fff;">0</span>m</div>
    </div>

    <div class="controls">
      <input type="number" id="mise-input" value="1000" step="500">
      <button id="btn-play">🚀 MONTER</button>
      <button id="btn-cashout" disabled>💰 STOP & CASH</button>
    </div>

    <div id="game-over-modal" class="hidden">
      <h1>CRASH !</h1>
      <p id="result-desc" style="color: #ccc; font-size: 0.95rem;">Le câble a lâché dans les profondeurs.</p>
      <button id="btn-replay">RÉESSAYER</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, bucketGroup, rope, particles;
    let isPlaying = false;
    let currentMultiplier = 1.00;
    let currentDepth = 0;
    let interval;
    let solde = 413711;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05050d);
      scene.fog = new THREE.FogExp2(0x05050d, 0.15);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.2, 3.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lumières
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x00fff0, 2, 10);
      pointLight.position.set(0, 2, 2);
      scene.add(pointLight);

      // Puits (Cylindre intérieur)
      const wellGeo = new THREE.CylinderGeometry(2, 2, 20, 32, 1, true);
      const wellMat = new THREE.MeshStandardMaterial({ 
        color: 0x111122, 
        roughness: 0.8, 
        side: THREE.BackSide,
        wireframe: true 
      });
      const well = new THREE.Mesh(wellGeo, wellMat);
      scene.add(well);

      // Groupe du Seau
      bucketGroup = new THREE.Group();

      const bucketGeo = new THREE.CylinderGeometry(0.5, 0.35, 0.9, 16, 1, true);
      const bucketMat = new THREE.MeshStandardMaterial({ color: 0x00fff0, metalness: 0.5, roughness: 0.2 });
      const bucketMesh = new THREE.Mesh(bucketGeo, bucketMat);
      bucketGroup.add(bucketMesh);

      const handleGeo = new THREE.TorusGeometry(0.48, 0.03, 8, 16, Math.PI);
      const handleMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
      const handleMesh = new THREE.Mesh(handleGeo, handleMat);
      handleMesh.position.y = 0.45;
      bucketGroup.add(handleMesh);

      scene.add(bucketGroup);

      // Câble
      const ropeGeo = new THREE.CylinderGeometry(0.015, 0.015, 10, 8);
      const ropeMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
      rope = new THREE.Mesh(ropeGeo, ropeMat);
      rope.position.y = 5.4;
      scene.add(rope);

      // Particules
      const pGeo = new THREE.BufferGeometry();
      const pCount = 100;
      const posArray = new Float32Array(pCount * 3);
      for(let i=0; i<pCount*3; i++) {
        posArray[i] = (Math.random() - 0.5) * 4;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const pMat = new THREE.PointsMaterial({ size: 0.03, color: 0x00fff0, transparent: true, opacity: 0.5 });
      particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      
      if (bucketGroup) {
        bucketGroup.rotation.y += 0.01;
        if (isPlaying) {
          bucketGroup.position.y = (currentMultiplier - 1) * 0.4 - 0.5;
          rope.position.y = bucketGroup.position.y + 5.4;
          particles.rotation.y -= 0.002;
        }
      }
      renderer.render(scene, camera);
    }

    window.onload = () => {
      init3D();

      const btnPlay = document.getElementById('btn-play');
      const btnCashout = document.getElementById('btn-cashout');
      const btnReplay = document.getElementById('btn-replay');
      const modal = document.getElementById('game-over-modal');

      btnPlay.addEventListener('click', () => {
        isPlaying = true;
        btnPlay.disabled = true;
        btnCashout.disabled = false;
        modal.classList.add('hidden');
        
        interval = setInterval(() => {
          currentMultiplier += 0.03;
          currentDepth += 1;
          document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
          document.getElementById('rempart').innerText = currentDepth;

          if (Math.random() < 0.035) {
            clearInterval(interval);
            isPlaying = false;
            btnPlay.disabled = false;
            btnCashout.disabled = true;
            modal.classList.remove('hidden');
          }
        }, 120);
      });

      btnCashout.addEventListener('click', () => {
        if (!isPlaying) return;
        clearInterval(interval);
        isPlaying = false;
        const mise = parseInt(document.getElementById('mise-input').value) || 1000;
        solde += Math.floor(mise * currentMultiplier);
        document.getElementById('solde').innerText = solde;
        btnPlay.disabled = false;
        btnCashout.disabled = true;
      });

      btnReplay.addEventListener('click', () => {
        currentMultiplier = 1.00;
        currentDepth = 0;
        document.getElementById('multiplier').innerText = '1.00x';
        document.getElementById('rempart').innerText = '0';
        bucketGroup.position.y = -0.5;
        rope.position.y = 4.9;
        modal.classList.add('hidden');
      });
    };
  </script>
</body>
</html>
